name: Build Rock
description: Installs the build toolchain and builds Rock.sln. Used by the Ship it verify build.

inputs:
  working-directory:
    description: Folder that contains Rock.sln.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Pick the Node version this branch needs
      id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # 20.0 and newer declare a minimum in package.json "engines", for
        # example ">=24.5.0", and npm refuses to install on anything older.
        # Use that major version. Older branches have no "engines", so they
        # keep the Node version they were built with.
        major=$(tr -d '\n' < Rock.JavaScript.Obsidian/package.json | grep -oE '"engines"[^}]*"node": *"[^0-9]*[0-9]+' | grep -oE '[0-9]+$' || true)
        echo "version=${major:-22.17.1}" >> "$GITHUB_OUTPUT"
        echo "Using Node ${major:-22.17.1}"

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ steps.node.outputs.version }}

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2

    - name: Build Rock.sln
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      run: |
        nuget restore Rock.sln
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        msbuild Rock.sln -m -restore -p:Configuration=Debug -v:minimal
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
