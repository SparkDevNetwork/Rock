# Everything the chat platform code has to pass. "Dev Tools/chat-ci/ci.mjs" runs the same gates
# locally, in the same order, so a failure here can be reproduced before pushing.
#
# The build is the unit test project and what it needs, not the whole solution: this pipeline is
# here to prove the chat code compiles and its own tests run, and Rock's own build already proves
# the rest. The test filters are narrowed to the chat namespace for the same reason, so a failure
# in this workflow is always a failure in this work.
#
# Every test run is followed by a check on its own results file. A filter that matches nothing
# prints "No test matches the given testcase filter" and exits zero, so without that check a
# renamed namespace or a moved folder would leave this workflow green having run nothing.
name: chat ci

on:
  pull_request:
    # "labeled" is what lets the integration job below start when somebody adds the label; without
    # it the label would only take effect on the next push.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [chat-platform]

concurrency:
  group: chat-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: gates, build, unit and client tests
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install the chat gate tools
        run: npm ci
        working-directory: ./Dev Tools/chat-ci

      - name: The chat files name nothing a reader here cannot open
        run: npm run check:references
        working-directory: ./Dev Tools/chat-ci

      - name: The gates keep the shape these jobs assume
        run: npm test
        working-directory: ./Dev Tools/chat-ci

      - name: Build the unit test project and what it depends on
        run: msbuild Rock.Tests\Rock.Tests.csproj /t:Restore,Build /p:Configuration=Debug /m /v:minimal /nologo

      - name: Build the blocks project, which holds the chat blocks
        run: msbuild Rock.Blocks\Rock.Blocks.csproj /t:Restore,Build /p:Configuration=Debug /m /v:minimal /nologo

      - name: Unit tests
        run: dotnet test Rock.Tests\Rock.Tests.csproj --no-build --filter "FullyQualifiedName~Communication.Chat.Platform" --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: The unit run ran something
        run: node "Dev Tools/chat-ci/assert-tests-ran.mjs" TestResults/unit.trx --minimum 1

      # The chat card shares the connected services provider with Rock IQ and Knowledge Base, and
      # their tests are what catches a change to it. None of them are in the chat namespace, so
      # they get their own run rather than a wider filter that would stop meaning "chat".
      #
      # The filter is the full namespace and not a loose substring: "Configuration.ConnectedServices"
      # on its own also matches the chat entry tests, which the run above already counts, and a
      # floor set with those included would let real provider tests disappear unnoticed.
      - name: Connected services tests, the shared-provider tripwire
        run: dotnet test Rock.Tests\Rock.Tests.csproj --no-build --filter "FullyQualifiedName~Rock.Tests.Configuration.ConnectedServices" --logger "trx;LogFileName=connected-services.trx" --results-directory TestResults

      # 78 is what that namespace holds today, measured: 59 provider tests and 19 encoder tests.
      - name: The tripwire still has its tests
        run: node "Dev Tools/chat-ci/assert-tests-ran.mjs" TestResults/connected-services.trx --minimum 78

      - name: Install the client dependencies
        run: npm ci
        working-directory: ./Rock.JavaScript.Obsidian.Blocks

      - name: Client tests
        run: npx jest tests/Communication/Chat tests/Administration/sparkConnectedServices
        working-directory: ./Rock.JavaScript.Obsidian.Blocks

  integration:
    name: integration tests, on the run-integration label
    runs-on: windows-2022
    # These need a database and take minutes, so they stay off until somebody asks for them by
    # putting the label on a pull request. There are no chat integration tests yet, so asking for
    # them today fails on the empty run rather than reporting a success that nothing earned.
    if: contains(github.event.pull_request.labels.*.name, 'run-integration')
    steps:
      - uses: actions/checkout@v5

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Point the test harness at the runner's LocalDB
        # The harness defaults to a Linux SQL Server container, which a Windows runner cannot start.
        run: |
          Copy-Item Rock.Tests.Integration\app.TestSettings.config.example Rock.Tests.Integration\app.TestSettings.config
          Copy-Item Rock.Tests.Integration\app.ConnectionStrings.config.example Rock.Tests.Integration\app.ConnectionStrings.config
          (Get-Content Rock.Tests.Integration\app.TestSettings.config) -replace '"DatabaseHost" value="docker"', '"DatabaseHost" value="localdb"' | Set-Content Rock.Tests.Integration\app.TestSettings.config

      - name: Build the integration test project and what it depends on
        run: msbuild Rock.Tests.Integration\Rock.Tests.Integration.csproj /t:Restore,Build /p:Configuration=Debug /m /v:minimal /nologo

      - name: Integration tests
        run: dotnet test Rock.Tests.Integration\Rock.Tests.Integration.csproj --no-build --filter "FullyQualifiedName~Communication.Chat.Platform" --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: The integration run ran something
        run: node "Dev Tools/chat-ci/assert-tests-ran.mjs" TestResults/integration.trx --minimum 1
