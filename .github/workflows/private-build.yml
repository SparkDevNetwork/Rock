name: Private PR Build

# Builds Rock.sln for every PR in the private mirror. Ship it requires this
# build to have passed on the PR's latest commit.
#
# This file also exists in the public repo (the mirror copies develop), but the
# repository check below keeps it from ever running there.
#
# Build runner (optional):
#   vars.BUILD_RUNNER  JSON for runs-on. Unset uses GitHub-hosted "windows-latest".
#                      Set to ["self-hosted","windows","rock-build"] to use our own
#                      Windows VM. See the internal mirror setup guide.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    # Ship it looks for a check run with this exact name. Don't rename it.
    name: build
    if: github.repository == 'SparkStealth/Rock-Mirror'
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"windows-latest"') }}
    timeout-minutes: 60
    # A new push to the PR cancels the build of the previous push.
    concurrency:
      group: pr-build-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build-rock
