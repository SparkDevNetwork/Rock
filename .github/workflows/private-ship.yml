name: Ship to Public

# The "Ship it" button. Adding the `ship` label to a PR in the private mirror:
#   1. Checks no reviewer has outstanding "Request changes" on the PR. Adding the
#      label is the approval, so authors can ship their own PRs (GitHub doesn't
#      let anyone approve their own PR).
#   2. Rebases the PR onto the LIVE public branch (not the mirror's copy).
#   3. Checks commit messages use the release-note format (+ or -).
#   4. Merges the change up every branch it must reach, following the
#      MERGE_CHAIN variable. Every step is a real merge commit, never a squash.
#   5. Pushes the target branch and every merged-up branch in ONE atomic push:
#      either all of them update or none do. Git rejects the push if public
#      moved, so nothing on public can ever be overwritten.
#   6. Comments with the public commit links and closes the PR.
#   7. After the verify build passes, deletes the PR's branch from the mirror.
#      If the build fails, the branch is kept so the fix can go on it.
# On any failure, including a merge-up conflict, nothing is pushed. It comments
# the reason and removes the label.
#
# The `ship-only` label does steps 1 to 3 and 5 for the target branch only, with
# no merge-up. It's the escape hatch when a merge-up conflicts: ship with
# `ship-only`, then do that merge-up by hand.
#
# Shipping does NOT wait on a build, so it takes about a minute. This matches
# how Rock already works: code lands, then gets built. A verify job builds the
# last branch updated (develop when the merge-up reaches it) and comments on
# the PR, tagging whoever shipped, if the build fails.
#
# This file also exists in the public repo (the mirror copies develop), but the
# repository checks below keep it from ever running there.
#
# Required in the private repo:
#   vars.SHIP_APP_ID              App ID of the "Rock Ship Bot" GitHub App
#   secrets.SHIP_APP_PRIVATE_KEY  Private key of that App
# The App is installed on SparkDevNetwork/Rock with Contents and Workflows write,
# and is allowed to bypass any rules on the public shippable branches.
#
# Merge paths (required for `ship`):
#   vars.MERGE_CHAIN  JSON map of each branch to the branches it merges into,
#                     for example {"release-20.0": ["hotfix-20.1"], "hotfix-20.1": ["develop"]}.
#                     A branch with two parents (like hotfix-18.7, fed by both
#                     hotfix-17.11 and hotfix-18.6) gets one merge from each.
#
# Build runner for the verify job (optional):
#   vars.BUILD_RUNNER  JSON for runs-on. Unset uses GitHub-hosted "windows-latest".
#                      Set to ["self-hosted","windows","rock-build"] to use our own
#                      Windows VM.

on:
  pull_request:
    types: [labeled]

permissions:
  # Write is only used to delete the PR's branch from the mirror after shipping.
  contents: write
  pull-requests: write
  issues: write

jobs:
  ship:
    if: github.repository == 'SparkStealth/Rock-Mirror' && (github.event.label.name == 'ship' || github.event.label.name == 'ship-only')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One ship at a time across ALL branches. A merge-up can touch several
    # branches, so two ships to different branches could otherwise collide.
    # Scoped to this job only, so a running verify build doesn't hold up the next ship.
    concurrency:
      group: ship
      cancel-in-progress: false
    outputs:
      sha: ${{ steps.push.outputs.sha }}
      branch: ${{ steps.push.outputs.branch }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BASE: ${{ github.event.pull_request.base.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      ACTOR: ${{ github.actor }}
      LABEL: ${{ github.event.label.name }}
    steps:
      - name: Check the target branch
        run: |
          case "$BASE" in
            develop|release-*|hotfix-*) ;;
            *)
              echo "SHIP_FAIL=Only PRs targeting develop, release-* or hotfix-* can ship. This one targets \`$BASE\`." >> "$GITHUB_ENV"
              exit 1 ;;
          esac

      - name: Check nobody has requested changes
        run: |
          # Adding the label is the approval, so no approving review is needed.
          # Only blocks if a reviewer's latest review is still "Request changes".
          blockers=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" -q '
            [.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")]
            | group_by(.user.login) | map(select(last.state == "CHANGES_REQUESTED") | last.user.login)
            | join(", ")')

          if [ -n "$blockers" ]; then
            echo "SHIP_FAIL=Changes were requested by $blockers. Address them and get the review dismissed or re-approved, then add the \`$LABEL\` label again." >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Create ship token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SHIP_APP_ID }}
          private-key: ${{ secrets.SHIP_APP_PRIVATE_KEY }}
          owner: SparkDevNetwork
          repositories: Rock

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto live public branch
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR@users.noreply.github.com"

          # Fetch by URL instead of adding a remote, so the token is never
          # written to .git/config.
          git fetch "https://x-access-token:${TOKEN}@github.com/SparkDevNetwork/Rock.git" \
            "+refs/heads/$BASE:refs/remotes/public/$BASE"

          if ! git rebase "public/$BASE"; then
            files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
            git rebase --abort
            {
              echo "SHIP_FAIL<<EOF"
              echo "Rebasing onto public \`$BASE\` hit conflicts in:"
              echo "$files"
              echo ""
              echo "Run \`git fetch origin\` and \`git rebase origin/$BASE\` locally, resolve, push to this branch, then add the \`$LABEL\` label again."
              echo "EOF"
            } >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Check commit messages
        run: |
          bad=$(git log "public/$BASE..HEAD" --format='%s' | grep -vE '^[+-] ' || true)
          if [ -n "$bad" ]; then
            {
              echo "SHIP_FAIL<<EOF"
              echo "These commit messages don't use the release-note format (\`+ (Domain) ...\` or \`- ...\`). Reword them, then add the \`$LABEL\` label again:"
              echo "$bad" | sed 's/^/- /'
              echo "EOF"
            } >> "$GITHUB_ENV"
            exit 1
          fi

          # The rebased PR becomes the new tip of the target branch. Named after
          # the real branch so merge commits read "Merge branch '<branch>' into ...".
          git branch -f "$BASE" HEAD
          echo "PUSH_BRANCHES=$BASE" >> "$GITHUB_ENV"

      - name: Work out the merge-up order
        if: env.LABEL == 'ship'
        env:
          MERGE_CHAIN: ${{ vars.MERGE_CHAIN }}
        run: |
          if [ -z "$MERGE_CHAIN" ]; then
            echo "SHIP_FAIL=The \`MERGE_CHAIN\` variable isn't set on this repo, so the merge-up path is unknown. Use \`ship-only\` for now." >> "$GITHUB_ENV"
            exit 1
          fi

          # Prints one "<from> <into>" line per merge, in the order to run them.
          # A branch is only merged onward after every branch feeding it is done.
          python3 - > merge-plan.txt <<'PY'
          import json, os, sys
          base = os.environ["BASE"]
          chain = json.loads(os.environ["MERGE_CHAIN"])

          # Every branch this change must reach.
          reach, todo = {base}, [base]
          while todo:
              for nxt in chain.get(todo.pop(), []):
                  if nxt not in reach:
                      reach.add(nxt)
                      todo.append(nxt)

          parents = {n: [p for p in reach if n in chain.get(p, [])] for n in reach}
          done, order = [base], []
          while len(done) < len(reach):
              ready = sorted(n for n in reach if n not in done and all(p in done for p in parents[n]))
              if not ready:
                  sys.exit("MERGE_CHAIN contains a loop.")
              for n in ready:
                  order.append(n)
                  done.append(n)

          for n in order:
              for p in sorted(parents[n], key=done.index):
                  print(p, n)
          PY

          echo "Merge plan:"
          cat merge-plan.txt

      - name: Merge up
        if: env.LABEL == 'ship'
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          targets=$(awk '{print $2}' merge-plan.txt | awk '!seen[$0]++')
          if [ -z "$targets" ]; then
            echo "Nothing to merge up from $BASE."
            exit 0
          fi

          # Start every target branch from the live public version.
          refspecs=""
          for t in $targets; do refspecs="$refspecs +refs/heads/$t:refs/remotes/public/$t"; done
          git fetch "https://x-access-token:${TOKEN}@github.com/SparkDevNetwork/Rock.git" $refspecs
          for t in $targets; do git branch -f "$t" "public/$t"; done

          # Real merge commits (--no-ff), never a squash.
          while read -r from into; do
            git switch -q "$into"
            if ! git merge --no-ff --no-edit "$from"; then
              files=$(git diff --name-only --diff-filter=U | sed 's/^/- `/; s/$/`/')
              git merge --abort
              {
                echo "SHIP_FAIL<<EOF"
                echo "Merging \`$from\` into \`$into\` hit conflicts. Nothing was pushed to any branch."
                echo "$files"
                echo ""
                echo "To ship now: add the \`ship-only\` label to ship to \`$BASE\` without merging up, then do the merge-up by hand in SmartGit."
                echo "EOF"
              } >> "$GITHUB_ENV"
              exit 1
            fi
          done < merge-plan.txt

          # Unquoted on purpose: collapses the newline-separated targets onto one line.
          echo "PUSH_BRANCHES=$(echo $BASE $targets)" >> "$GITHUB_ENV"

      - name: Push to public
        id: push
        env:
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          refspecs=""
          for b in $PUSH_BRANCHES; do refspecs="$refspecs refs/heads/$b:refs/heads/$b"; done

          # --atomic: every branch updates, or none do.
          if ! git push --atomic "https://x-access-token:${TOKEN}@github.com/SparkDevNetwork/Rock.git" $refspecs; then
            echo "SHIP_FAIL=One of the public branches changed during the ship, so nothing was pushed. Add the \`$LABEL\` label again to retry." >> "$GITHUB_ENV"
            exit 1
          fi

          {
            echo "SHIPPED<<EOF"
            for b in $PUSH_BRANCHES; do
              echo "- \`$b\`: https://github.com/SparkDevNetwork/Rock/commit/$(git rev-parse "$b")"
            done
            echo "EOF"
          } >> "$GITHUB_ENV"

          # Verify the last branch updated: develop when the merge-up reached it.
          last=$(echo $PUSH_BRANCHES | awk '{print $NF}')
          echo "branch=$last" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse "$last")" >> "$GITHUB_OUTPUT"
          echo "VERIFY_BRANCH=$last" >> "$GITHUB_ENV"

      - name: Close the PR
        run: |
          gh pr close "$PR" -R "$GITHUB_REPOSITORY" \
            -c "Shipped to public by @$ACTOR ($LABEL):
          $SHIPPED

          A verify build of \`$VERIFY_BRANCH\` is running now. You'll get a comment here if it fails."

      - name: Report failure
        if: failure()
        run: |
          reason="${SHIP_FAIL:-Something unexpected failed. See the workflow log.}"
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
            -b "**Ship failed.** $reason

          [Workflow log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$LABEL" || true

  verify:
    # Builds the exact commit that just landed on public. If it fails, two
    # changes broke each other without a git conflict and develop needs a fix.
    needs: ship
    if: needs.ship.outputs.sha != ''
    runs-on: ${{ fromJSON(vars.BUILD_RUNNER || '"windows-latest"') }}
    timeout-minutes: 60
    steps:
      - name: Checkout the shipped commit
        uses: actions/checkout@v5
        with:
          repository: SparkDevNetwork/Rock
          ref: ${{ needs.ship.outputs.sha }}
          # Separate folder, so a self-hosted runner keeps its mirror clone intact.
          path: shipped
          fetch-depth: 1
          persist-credentials: false

      - name: Build
        uses: ./shipped/.github/actions/build-rock
        with:
          working-directory: shipped

      - name: Report a broken build
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ needs.ship.outputs.branch }}
          SHA: ${{ needs.ship.outputs.sha }}
          ACTOR: ${{ github.actor }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" \
            -b "**Public \`$BRANCH\` is broken after this ship.** @$ACTOR, commit https://github.com/SparkDevNetwork/Rock/commit/$SHA doesn't build. This usually means another change that landed first conflicts with this one without a git conflict.

          Your branch \`$HEAD_REF\` was kept. Push the fix to it, reopen this PR, and add \`ship\` again. The commits that already shipped are skipped automatically.

          [Build log]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"

      - name: Delete the PR's branch from the mirror
        # Only after the build passes. If it fails, the branch is kept for the fix.
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Never delete a shared branch, even if a PR was opened from one.
          case "$HEAD_REF" in
            develop|release-*|hotfix-*) echo "Not deleting shared branch $HEAD_REF."; exit 0 ;;
          esac
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF" \
            && echo "Deleted $HEAD_REF." \
            || echo "::warning::Couldn't delete $HEAD_REF. Delete it by hand."
