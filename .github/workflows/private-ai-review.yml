name: Private AI Review

# Runs AI reviewers on PRs in the private mirror. Findings are posted as PR
# comments, which are only visible to people with access to the mirror.
#
#   code      General code review: bugs, edge cases and Rock conventions. Runs
#             automatically when a PR is opened, unless the PR has the
#             `no-code-review` label. For a fresh review after pushing fixes,
#             re-run this job from the PR's Checks tab: it reviews the PR's
#             latest code, and still skips a PR labeled `no-code-review`.
#   sentinel  Full Sentinel security review. Uses a lot of credits, so it only
#             runs when someone adds the `sentinel` label. The label is removed
#             when the review finishes, so adding it again runs a fresh review.
#
# This file also exists in the public repo (the mirror copies develop), but the
# repository checks below keep it from ever running there.
#
# Required in the private repo:
#   secrets.ANTHROPIC_API_KEY

on:
  pull_request:
    types: [opened, labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  code:
    if: >-
      github.repository == 'SparkStealth/Rock-Mirror'
      && github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ai-review-code-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check for the no-code-review label
        id: skip
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # `gh pr create --label` adds labels just after the PR is opened, so
          # the event can arrive without them. Wait, then read the live labels.
          sleep 20
          labels=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels -q '.labels[].name')
          if echo "$labels" | grep -qx 'no-code-review'; then
            echo "The PR has the no-code-review label. Skipping the review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.skip.outputs.skip != 'true'
        uses: actions/checkout@v5
        with:
          # The PR's current merge ref, not the commit from when it was opened,
          # so re-running this job reviews the latest code.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 1

      - name: Load review conventions from develop
        # Older release and hotfix branches don't have CLAUDE.md or .claude/rules,
        # so the review would run without any Rock conventions. Copy them from
        # develop. Skipped for PRs into develop, so a PR that edits the rules is
        # reviewed against its own copy.
        if: steps.skip.outputs.skip != 'true' && github.event.pull_request.base.ref != 'develop'
        run: |
          git fetch --no-tags --depth=1 origin develop
          git checkout FETCH_HEAD -- CLAUDE.md .claude/rules

      - name: Run code review
        if: steps.skip.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness bugs, missing edge cases, and
            violations of the Rock conventions in CLAUDE.md and .claude/rules/.
            Only report issues you are confident are real. Use inline comments on
            the exact lines, then post one summary comment. Never @-mention anyone.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"

  sentinel:
    if: >-
      github.repository == 'SparkStealth/Rock-Mirror'
      && github.event.label.name == 'sentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ai-review-sentinel-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # HEAD is the PR merged into its target branch. Depth 2 also brings in
          # the target branch's commit, so `git diff HEAD^1 HEAD` is the PR's change.
          fetch-depth: 2

      - name: Load review conventions from develop
        # Older release and hotfix branches don't have CLAUDE.md, .claude/rules or
        # the Sentinel agent, so copy them from develop. Skipped for PRs into
        # develop, so a PR that edits them is reviewed against its own copy.
        # Checking out files doesn't change HEAD, so `git diff HEAD^1 HEAD` is
        # still the PR's change.
        if: github.event.pull_request.base.ref != 'develop'
        run: |
          git fetch --no-tags --depth=1 origin develop
          git checkout FETCH_HEAD -- CLAUDE.md .claude/rules .claude/agents

      - name: Run Sentinel security review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: false
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Use the sentinel subagent (.claude/agents/sentinel.md) to run a security
            review of the changes in this pull request. The PR's changes are
            `git diff HEAD^1 HEAD`. If the sentinel agent file doesn't exist on this
            branch, do the security review yourself and say so in the summary.

            This repository is private, so include enough detail for the author to
            understand and fix each finding. Use inline comments on the exact lines,
            then post one summary comment titled "Sentinel security review". Never
            @-mention anyone.
          # Task/Agent lets Claude start the Sentinel sub-agent. The git commands
          # are read-only, for inspecting the change.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Task,Agent,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

      - name: Remove the sentinel label
        # Always remove it, so adding the label again starts a fresh review.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/sentinel" || true
